name: test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python make_sample.py
      - name: Reports on the sample files
        shell: python
        run: |
          import subprocess, sys
          def run(*args):
              return subprocess.run([sys.executable, "casecheck.py", *args], capture_output=True, text=True)
          names = run("names", "sample/names.txt")
          assert names.returncode == 1 and "letter case: 3" in names.stdout and "'notes.txt', 'Notes.txt', 'NOTES.TXT'" in names.stdout, names.stdout
          folder = run("folder", "sample/tree")
          assert folder.returncode == 0 and "Names checked: 4" in folder.stdout, folder.stdout
          print("Sample case reports checked.")
